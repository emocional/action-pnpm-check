name: check pnpm project
description: 'Install nodejs and pnpm environment and run most commons checks'

branding:
  icon: 'check-square'
  color: 'green'

inputs:
  pnpm-version:
    required: false
    description: pnpm major version
    default: '11'
  node-version:
    required: false
    description: nodejs version
    default: 'lts/jod'
  token:
    description: github token
    default: ${{ github.token }}
  minimum-release-age:
    required: false
    description: minimum package release age in minutes
    default: '1440'
  cache-dependency-path:
    required: false
    description: lockfile path(s) for pnpm store cache key (newline-separated)
    default: pnpm-lock.yaml
  working-directory:
    required: false
    description: directory to run pnpm install from
    default: .
  recursive:
    required: false
    description: pass -r to pnpm install
    default: 'true'
  strict-peer-dependencies:
    required: false
    description: pass --strict-peer-dependencies to pnpm install
    default: 'true'

runs:
  using: 'composite'
  steps:
    - uses: emocional/action-pnpm-install@main
      with:
        node-version: ${{ inputs.node-version }}
        pnpm-version: ${{ inputs.pnpm-version }}
        token: ${{ inputs.token }}
        minimum-release-age: ${{ inputs.minimum-release-age }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        working-directory: ${{ inputs.working-directory }}
        recursive: ${{ inputs.recursive }}
        strict-peer-dependencies: ${{ inputs.strict-peer-dependencies }}

    # TEMPORARILY DISABLED:
    # Commitlint action currently mismatches the commitlint major used in some repos.
    # Re-enable once the action supports the target commitlint version.
    # - name: Commit lint
    #   uses: wagoid/commitlint-github-action@v6.2.1

    - name: Check
      shell: sh
      run: pnpm check

    - name: Build production
      shell: sh
      env:
        NODE_ENV: production
      run: pnpm build

    - name: Test
      uses: ArtiomTr/jest-coverage-report-action@v2
      with:
        skip-step: install
        output: comment, report-markdown
        package-manager: pnpm
        test-script: pnpm test:cov
